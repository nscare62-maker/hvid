<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification Review - HVID Admin</title>
  <link rel="stylesheet" href="/static/css/global.css" />
  <link rel="stylesheet" href="/static/css/dashboard.css" />
  <style>
    :root{--ink:#080910;--panel:#11131d;--panel-2:#171a27;--line:rgba(255,255,255,.09);--violet:#8b7cff;--mint:#38d9a4;--amber:#f7b955}.admin-login,.review-panel{width:min(1080px,calc(100% - 40px));margin:58px auto}.admin-login{max-width:390px;padding:34px;background:linear-gradient(145deg,rgba(25,28,45,.96),rgba(12,14,24,.96));border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.admin-login h2{font-size:24px;margin:0 0 8px}.admin-login input{display:block;width:100%;box-sizing:border-box;margin:0 0 12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.045);color:#fff}.admin-login button{height:44px;border-radius:10px;font-weight:700}.admin-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.admin-kicker{color:var(--violet);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}.admin-hero h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;margin:0 0 8px}.admin-hero p{margin:0;color:#8f94ab}.admin-live{display:flex;align-items:center;gap:8px;color:#a8b0c7;font-size:12px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}.admin-live:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}.metric{padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015))}.metric-label{color:#878da6;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.metric-value{font-size:28px;font-weight:800;margin-top:9px}.metric-value.mint{color:var(--mint)}.metric-value.amber{color:var(--amber)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}.tabs,.filters{display:flex;gap:7px;flex-wrap:wrap}.tabs button,.filters button{padding:10px 15px;border:1px solid var(--line);border-radius:9px;background:transparent;color:#8e94aa;cursor:pointer;transition:.2s}.tabs button{font-weight:700}.tabs button.active,.filters button.active{color:#fff;border-color:rgba(139,124,255,.75);background:rgba(139,124,255,.14);box-shadow:0 0 22px rgba(139,124,255,.09)}.search{width:230px;padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);color:#fff;outline:none}.search:focus{border-color:var(--violet)}.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.submission{position:relative;padding:20px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(25,28,43,.9),rgba(13,15,25,.9));cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}.submission:hover{transform:translateY(-3px);border-color:rgba(139,124,255,.65);box-shadow:0 14px 35px rgba(0,0,0,.25)}.submission-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.submission-avatar{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#8175ff,#4d47b8);font-weight:800}.submission-status{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#aeb5cd;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06)}.submission-name{font-size:16px;font-weight:750;color:#f3f4fa}.submission-type{color:#8c92ab;font-size:12px;margin-top:5px}.submission-foot{display:flex;justify-content:space-between;gap:8px;margin-top:20px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);color:#727990;font-size:11px}.empty{grid-column:1/-1;padding:52px 20px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:#81879c}.empty strong{display:block;color:#dfe2ee;font-size:15px;margin-bottom:6px}.modal{display:none;position:fixed;inset:0;background:rgba(3,4,9,.82);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;padding:28px;border:1px solid var(--line);border-radius:20px;background:#121520;box-shadow:0 30px 100px rgba(0,0,0,.55)}.modal-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.modal-close{border:0;background:rgba(255,255,255,.06);color:#afb5ca;border-radius:8px;padding:8px 11px;cursor:pointer}.preview{margin:20px 0;background:#080910;border:1px solid var(--line);border-radius:13px;min-height:180px;padding:14px;display:grid;place-items:center}.preview img{max-width:100%;max-height:390px;object-fit:contain;border-radius:8px}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px;border:0;border-radius:10px;font-weight:750;cursor:pointer}.approve{background:var(--mint);color:#062118}.reject{background:#9e2929;color:#fff}.muted{color:#8d93aa;font-size:13px}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.admin-hero{display:block}.admin-live{margin-top:16px;width:max-content}.search{width:100%}}@media(max-width:420px){.metrics{grid-template-columns:1fr 1fr}.metric{padding:14px}.metric-value{font-size:23px}}
    .admin-main { margin-left: 0; }
  </style>
</head>
<body>
  <div class="dashboard-shell"><div class="dashboard-main admin-main"><header class="topbar"><div class="topbar-title">HVID Admin</div></header><main class="page-content">
      <div id="login-gate" class="admin-login"><h2>Admin Sign In</h2><p class="muted">Review submitted KYC documents and face captures.</p><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="btn btn-primary" style="width:100%" onclick="login()">Sign In</button><p id="login-error" class="muted"></p></div>
      <div id="review-panel" class="review-panel" style="display:none"><div class="admin-hero"><div><div class="admin-kicker">Operations console</div><h1>Verification Review</h1><p>Inspect identity evidence and make confident decisions.</p></div><div class="admin-live">Review system online</div></div><div class="metrics"><div class="metric"><div class="metric-label">Queue total</div><div class="metric-value" id="metric-total">0</div></div><div class="metric"><div class="metric-label">Under review</div><div class="metric-value amber" id="metric-review">0</div></div><div class="metric"><div class="metric-label">Approved</div><div class="metric-value mint" id="metric-approved">0</div></div><div class="metric"><div class="metric-label">Current view</div><div class="metric-value" id="metric-view">KYC</div></div></div><div class="toolbar"><div class="tabs"><button class="active" onclick="setType('kyc',this)">KYC Review</button><button onclick="setType('face',this)">Face Verification</button><button onclick="setType('asset',this)">Asset Review</button></div><input id="queue-search" class="search" placeholder="Search name, phone, document..." autocomplete="off"></div><div id="filters" class="filters"></div><div id="queue" class="queue"></div></div>
    </main></div>
  </div>
  <div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><div class="modal-head"><div><h2 id="title">Review</h2><p id="meta" class="muted"></p></div><button class="modal-close" onclick="closeModal()">Close</button></div><div id="preview" class="preview">Select a submission</div><div id="actions" class="actions"></div></div></div>
<script>
'use strict';
localStorage.removeItem('hvid_');
let key = '';
let type = 'kyc';
let selected = null;
let status = 'ALL';
let currentItems = [];

const el = id => document.getElementById(id);
const headers = () => ({ 'X-Admin-Key': key, 'Content-Type': 'application/json' });

async function login() {
  const username = el('username').value.trim();
  const password = el('password').value;
  const error = el('login-error');
  error.textContent = '';
  try {
    const response = await fetch('/api/kyc/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await response.json();
    if (!response.ok) {
      error.textContent = data.error || 'Login failed.';
      return;
    }
    key = data.admin_key;
    localStorage.setItem('hvid_', key);
    showPanel();
  } catch (_) {
    error.textContent = 'Cannot connect to the server. Please restart the app and try again.';
  }
}

function showPanel() {
  el('login-gate').style.display = 'none';
  el('review-panel').style.display = 'block';
  load();
}

function setType(next, button) {
  type = next;
  status = 'ALL';
  document.querySelectorAll('.tabs button').forEach(item => item.classList.remove('active'));
  button.classList.add('active');
  renderFilters();
  load();
}

function renderFilters() {
  const values = type === 'face' ? ['ALL', 'UNDER_REVIEW', 'VERIFIED', 'REJECTED', 'NOT_STARTED'] : type === 'kyc' ? ['ALL', 'UNDER_REVIEW', 'VERIFIED', 'REJECTED', 'PENDING'] : ['ALL', 'PENDING_REVIEW', 'VERIFIED', 'REJECTED', 'PENDING'];
  el('filters').innerHTML = values.map(value => `<button class="${value === status ? 'active' : ''}" data-status="${value}">${value.replaceAll('_', ' ')}</button>`).join('');
  el('filters').querySelectorAll('button').forEach(button => button.addEventListener('click', () => { status = button.dataset.status; renderFilters(); load(); }));
}

async function load() {
  const path = type === 'kyc'
    ? `/api/kyc/admin/pending?status=${status}`
    : type === 'face'
      ? `/api/face/admin/pending?status=${status}`
      : `/api/asset/admin/pending?status=${status}`;
  const response = await fetch(path, { headers: headers() });
  if (response.status === 403) {
    localStorage.removeItem('hvid_');
    window.location.reload();
    return;
  }
  const data = await response.json();
  const items = type === 'asset' ? (data.assets || []) : (data.submissions || []);
  currentItems = items;
  updateMetrics(items);
  renderQueue();
}

function updateMetrics(items) {
  el('metric-total').textContent = items.length;
  el('metric-view').textContent = type === 'kyc' ? 'KYC' : type === 'face' ? 'Face' : 'Assets';
  el('metric-review').textContent = items.filter(item => (item.status || item.verificationStatus || '').toUpperCase().includes('REVIEW')).length;
  el('metric-approved').textContent = items.filter(item => (item.status || item.verificationStatus || '').toUpperCase().includes('VERIFIED')).length;
}

function renderQueue() {
  const query = (el('queue-search').value || '').trim().toLowerCase();
  const items = currentItems.filter(item => JSON.stringify(item).toLowerCase().includes(query));
  if (!items.length) {
    el('queue').innerHTML = `<div class="empty"><strong>${query ? 'No matching records' : 'Nothing in this queue yet'}</strong><span>${query ? 'Try a different search term.' : 'New submissions will appear here automatically.'}</span></div>`;
    return;
  }
  el('queue').innerHTML = items.map(item => {
    const id = item.kyc_id || item.identity_id || item.assetId;
    const name = item.username ? '@' + item.username : 'Identity ' + (item.phone_last4 || '—');
    const typeLabel = type === 'kyc' ? (item.document_type || 'Government ID').replaceAll('_', ' ') : type === 'face' ? 'Face capture' : (item.type || 'Asset') + ' · ' + (item.displayValue || '');
    const date = item.submitted_at || item.createdAt;
    const state = item.status || item.verificationStatus || status;
    return `<div class="submission" data-review-id="${id}"><div class="submission-top"><div class="submission-avatar">${name.replace('@','').charAt(0).toUpperCase()}</div><span class="submission-status">${state.replaceAll('_',' ')}</span></div><div class="submission-name">${name}</div><div class="submission-type">${typeLabel}</div><div class="submission-foot"><span>${date ? new Date(date).toLocaleDateString() : 'No date'}</span><span>Open review →</span></div></div>`;
  }).join('');
  document.querySelectorAll('[data-review-id]').forEach(item => item.addEventListener('click', () => openReview(item.dataset.reviewId)));
}

async function openReview(id) {
  selected = id;
  const path = type === 'kyc' ? `/api/kyc/admin/detail/${id}` : type === 'face' ? `/api/face/admin/detail/${id}` : `/api/asset/admin/detail/${id}`;
  const response = await fetch(path, { headers: headers() });
  const data = await response.json();
  el('title').textContent = type === 'kyc' ? 'KYC Review' : type === 'face' ? 'Face Verification Review' : 'Asset Review';
  el('meta').textContent = `${data.username ? '@' + data.username : 'Identity ' + (data.phone_last4 || '')} - ${data.status || data.verificationStatus}`;
  const image = type === 'kyc' ? data.document_data : type === 'face' ? data.image_data : null;
  let preview = type === 'asset' ? `<div class="muted">${data.type || 'Asset'}<br><strong style="color:#fff;font-size:18px">${data.displayValue || 'Not available'}</strong></div>` : image ? (image.startsWith('data:application/pdf') ? `<a href="${image}" target="_blank">Open government ID PDF</a>` : `<img src="${image}" alt="Verification image">`) : '<span class="muted">Image not available</span>';
  if (type === 'kyc' && data.selfie_data) preview += `<div style="margin-top:18px"><p class="muted">Submitted selfie</p><img src="${data.selfie_data}" alt="Selfie"></div>`;
  if (type === 'kyc' && data.personal_details) preview += `<pre class="muted" style="white-space:pre-wrap;text-align:left">${JSON.stringify(data.personal_details, null, 2)}</pre>`;
  el('preview').innerHTML = preview;
  el('actions').innerHTML = (data.status === 'UNDER_REVIEW' || data.verificationStatus === 'pending_review') ? '<button class="approve" id="approve-btn">Valid - Approve</button><button class="reject" id="reject-btn">Reject</button>' : '<span class="muted">Already reviewed</span>';
  if (el('approve-btn')) el('approve-btn').addEventListener('click', () => decide('approve'));
  if (el('reject-btn')) el('reject-btn').addEventListener('click', () => decide('reject'));
  el('modal').classList.add('open');
}

async function decide(action) {
  const base = type === 'kyc' ? '/api/kyc/admin' : type === 'face' ? '/api/face/admin' : '/api/asset/admin';
  const response = await fetch(`${base}/${action}/${selected}`, { method: 'POST', headers: headers(), body: JSON.stringify({ reason: 'Admin review' }) });
  const data = await response.json();
  if (!response.ok) { window.alert(data.error || 'Action failed'); return; }
  closeModal();
  load();
}

function closeModal() { el('modal').classList.remove('open'); selected = null; }
el('password').addEventListener('keydown', event => { if (event.key === 'Enter') login(); });
el('queue-search').addEventListener('input', renderQueue);
renderFilters();
</script></body></html>
